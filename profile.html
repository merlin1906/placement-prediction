<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<script>
function previewImage(event){

    const image = document.getElementById("preview");

    image.src = URL.createObjectURL(event.target.files[0]);

}
</script>

<body>

<div class="profile-card">

   <div class="top">

    <label for="photo">

        {% if student.photo %}
            <img src="{{ url_for('static', filename='uploads/' + student.photo) }}"
                 class="profile-pic"
                 id="preview">
        {% else %}
            <img src="{{ url_for('static', filename='images/default-user.png') }}"
                 class="profile-pic"
                 id="preview">
        {% endif %}

    </label>

    <h2>{{ student.name }}</h2>

    <p>{{ student.department }}</p>

</div>
   <form method="POST" enctype="multipart/form-data">

   

    <label>Name</label>
    <input type="text" name="name" value="{{ student.name }}" required>

    <label>Email</label>
    <input type="email" value="{{ student.email }}" readonly>

    <label>Department</label>
    <input type="text" name="department" value="{{ student.department }}" required>

    <label>CGPA</label>
    <input type="number" step="0.01" name="cgpa" value="{{ student.cgpa }}" required>

    <label>10th Percentage</label>
    <input type="number" step="0.01" name="tenth" value="{{ student.tenth }}" required>

    <label>12th Percentage</label>
    <input type="number" step="0.01" name="twelfth" value="{{ student.twelfth }}" required>

    <label>Aptitude</label>
    <input type="number" name="aptitude" value="{{ student.aptitude }}" required>

    <label>Programming</label>
    <input type="number" name="programming" value="{{ student.programming }}" required>

    <label>Communication</label>
    <input type="number" name="communication" value="{{ student.communication }}" required>

    <label>Projects</label>
    <input type="number" name="projects" value="{{ student.projects }}" required>

    <label>Internship</label>

    <select name="internship">

        <option value="Yes"
        {% if student.internship=="Yes" %}selected{% endif %}>
        Yes
        </option>

        <option value="No"
        {% if student.internship=="No" %}selected{% endif %}>
        No
        </option>

    </select>
    <input
        type="file"
        id="photo"
        name="photo"
        accept="image/*"
        onchange="previewImage(event)"
        hidden>

    <label>Backlogs</label>
    <input type="number" name="backlogs" value="{{ student.backlogs }}" required>

    <label>Certifications</label>
    <input type="number" name="certifications" value="{{ student.certifications }}" required>

    <button type="submit">Update Profile</button>

</form>

</div>

</div>

</body>

</html>
