<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Prediction History</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/history.css') }}">

</head>

<body>

<div class="sidebar">

    <h2>Placement AI</h2>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/prediction">🤖 Prediction</a>
    <a href="/history" class="active">📊 History</a>
    <a href="/profile">👤 Profile</a>
    <a href="/logout">🚪 Logout</a>

</div>

<div class="main">

<h1>Prediction History</h1>

<table>

<tr>

<th>Date</th>
<th>CGPA</th>
<th>Prediction</th>
<th>Probability</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[3] }}</td>

<td>{{ row[0] }}</td>

<td>

{% if row[1]=="Placed" %}

<span class="placed">Placed</span>

{% else %}

<span class="notplaced">Not Placed</span>

{% endif %}

</td>

<td>{{ row[2] }}%</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
