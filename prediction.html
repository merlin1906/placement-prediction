<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/prediction.css') }}">

</head>

<body>

<div class="container">

    <h1>Placement Prediction</h1>

    <form action="/predict" method="POST">

        <label>CGPA</label>
        <input type="number" step="0.01" name="cgpa" required>

        <label>10th Percentage</label>
        <input type="number" step="0.01" name="tenth" required>

        <label>12th Percentage</label>
        <input type="number" step="0.01" name="twelfth" required>

        <label>Aptitude Marks</label>
        <input type="number" name="aptitude" required>

        <label>Programming Skill</label>
        <input type="number" name="programming" required>

        <label>Communication Skill</label>
        <input type="number" name="communication" required>

        <label>Projects Completed</label>
        <input type="number" name="projects" required>

        <label>Internship</label>

        <select name="internship">

            <option value="Yes">Yes</option>

            <option value="No">No</option>

        </select>

        <label>Current Backlogs</label>
        <input type="number" name="backlogs" required>

        <label>Certifications</label>
        <input type="number" name="certifications" required>

        <button type="submit">
            Predict Placement
        </button>

    </form>

</div>

</body>

</html>
